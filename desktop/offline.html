<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Branshee — hors connexion</title>
  <style>
    :root { --bg: #f7f7f8; --surface: #ffffff; --text: #18181b; --muted: #52525b; --border: #e4e4e7; --accent: #4f46e5; --accent-hover: #4338ca; --on-accent: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111113; --surface: #1c1c1f; --text: #f4f4f5; --muted: #a1a1aa; --border: #2e2e33; --accent: #818cf8; --accent-hover: #a5b4fc; --on-accent: #111113; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 420px; margin: 16px; padding: 32px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
    svg { color: var(--muted); }
    h1 { margin: 16px 0 8px; font-size: 20px; line-height: 1.2; }
    p { margin: 0 0 24px; color: var(--muted); }
    button { height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; cursor: pointer; transition: background 150ms; }
    button:hover { background: var(--accent-hover); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button:disabled { opacity: .6; cursor: not-allowed; }
  </style>
</head>
<body>
  <main>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.41"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
    <h1>Pas de connexion</h1>
    <p>Branshee n'a pas pu être joint. Vérifiez votre connexion Internet, puis réessayez.</p>
    <button id="retry" type="button">Réessayer</button>
  </main>
  <script>
    const target = new URLSearchParams(location.search).get("retry");
    const btn = document.getElementById("retry");
    btn.addEventListener("click", () => {
      btn.disabled = true;
      btn.textContent = "Connexion…";
      if (target && /^https?:\/\//.test(target)) location.href = target;
    });
    window.addEventListener("online", () => btn.click());
  </script>
</body>
</html>
